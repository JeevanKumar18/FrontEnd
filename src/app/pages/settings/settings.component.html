<div class="settings-page">
  <div>
    <h1 class="settings-page-title">Settings</h1>
    <p class="settings-page-subtitle">Manage your application preferences</p>
  </div>

  @if (savedMessage) {
    <div class="alert-success">
      <p>{{ savedMessage }}</p>
    </div>
  }

  <!-- Notification Preferences -->
  <div class="settings-section">
    <div class="settings-section-header">
      <svg xmlns="http://www.w3.org/2000/svg" class="settings-section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <h2 class="settings-section-title">Notification Preferences</h2>
    </div>
    <div class="settings-section-body">
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Email Notifications</p>
          <p>Receive notifications via email</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.emailNotifications" class="settings-checkbox" />
      </label>
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Order Updates</p>
          <p>Get notified about order status changes</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.orderUpdates" class="settings-checkbox" />
      </label>
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Low Stock Alerts</p>
          <p>Receive alerts when stock is low</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.lowStockAlerts" class="settings-checkbox" />
      </label>
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Delivery Alerts</p>
          <p>Get notified about delivery updates</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.deliveryAlerts" class="settings-checkbox" />
      </label>
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Weekly Reports</p>
          <p>Receive weekly summary reports</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.weeklyReports" class="settings-checkbox" />
      </label>
    </div>
  </div>

  <!-- Security Settings -->
  <div class="settings-section">
    <div class="settings-section-header">
      <svg xmlns="http://www.w3.org/2000/svg" class="settings-section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <h2 class="settings-section-title">Security Settings</h2>
    </div>
    <div class="settings-section-body">
      <label class="settings-toggle-row">
        <div class="settings-toggle-info">
          <p>Two-Factor Authentication</p>
          <p>Add an extra layer of security</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.twoFactorAuth" class="settings-checkbox" />
      </label>
      <div>
        <label class="settings-field-label">Session Timeout (minutes)</label>
        <select [(ngModel)]="settings.sessionTimeout" class="settings-select">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">60 minutes</option>
          <option value="120">2 hours</option>
        </select>
      </div>
      <button class="btn-change-password">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Change Password
      </button>
    </div>
  </div>

  <!-- Appearance -->
  <div class="settings-section">
    <div class="settings-section-header">
      <svg xmlns="http://www.w3.org/2000/svg" class="settings-section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      <h2 class="settings-section-title">Appearance</h2>
    </div>
    <div class="settings-section-body">
      <div>
        <label class="settings-field-label">Theme</label>
        <div class="theme-grid">
          @for (theme of themes; track theme) {
            <button (click)="settings.theme = theme"
              class="theme-btn"
              [class.active]="settings.theme === theme">
              {{ theme }}
            </button>
          }
        </div>
      </div>
      <div>
        <label class="settings-field-label-flex">
          <svg xmlns="http://www.w3.org/2000/svg" class="settings-label-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          Language
        </label>
        <select [(ngModel)]="settings.language" class="settings-select">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Email Preferences -->
  <div class="settings-section">
    <div class="settings-section-header">
      <svg xmlns="http://www.w3.org/2000/svg" class="settings-section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <h2 class="settings-section-title">Email Preferences</h2>
    </div>
    <div class="settings-section-body">
      <div>
        <label class="settings-field-label">Email Frequency</label>
        <div class="freq-options">
          @for (freq of emailFrequencies; track freq.value) {
            <label class="freq-option" [class.active]="settings.emailFrequency === freq.value">
              <input type="radio" name="emailFrequency" [value]="freq.value" [(ngModel)]="settings.emailFrequency"
                class="freq-radio" />
              <div class="freq-option-info">
                <p>{{ freq.label }}</p>
                <p>{{ freq.desc }}</p>
              </div>
            </label>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="settings-actions-card">
    <div class="settings-actions-row">
      <button (click)="handleSave()" class="btn-save-settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
        Save Settings
      </button>
      <button (click)="handleReset()" class="btn-reset-settings">
        Reset to Default
      </button>
    </div>
  </div>
</div>
